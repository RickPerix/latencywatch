# =====================================
# 📶 LATENCYWATCH CONFIGURATION FILE
# =====================================
# Basic configuration for ping monitoring and command access
# Plugin version: 1.3 – by RickPerix

# -----------------------------
# ⚙️ CORE PLUGIN SETTINGS
# -----------------------------
latencywatch:
  # Whether LatencyWatch is active globally
  enabled: true

  # List of players excluded from ping evaluation
  # These players will NOT receive ping feedback or be listed in /pinglist
  excluded-players:
    - "ExampleUser"